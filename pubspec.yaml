name: fcxray
description: Open-source Xray-core VPN client for Android, Windows and macOS.
publish_to: none
version: 0.7.1+8

environment:
  sdk: ^3.12.0

dependencies:
  crypto: ^3.0.8
  ffi: ^2.2.0
  win32: ^6.4.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  tray_manager: ^0.5.2
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/licenses/
    - assets/examples/vless-vision-tcp.json
    - assets/examples/vless-vision-tcp-reality.json
    - assets/brand/logo.png
    - assets/brand/tray-template.png
    - windows/runner/resources/app_icon.ico
