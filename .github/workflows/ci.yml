name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python3 tool/build.py check
      - run: python3 tool/smoke.py
  desktop:
    if: github.ref_type != 'tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
            artifact: build/macos/Build/Products/Release/*.app
          - os: windows-latest
            target: windows
            artifact: build/windows/x64/runner/Release/
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python tool/build.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v6
        with:
          name: fcxray-${{ matrix.target }}-development
          path: ${{ matrix.artifact }}
  android:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: native/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      # Flutter's included plugin build resolves its own plugins independently
      # of android/settings.gradle.kts. Keep this in the workflow so it also
      # applies when workflow_dispatch checks out an older release tag.
      - name: Resolve Flutter Gradle plugin dependencies from Maven Central
        run: |
          init_dir="${GRADLE_USER_HOME:-$HOME/.gradle}/init.d"
          mkdir -p "$init_dir"
          cat > "$init_dir/fcxray-flutter-plugin-repositories.gradle" <<'GRADLE'
          gradle.beforeSettings { settings ->
              if (settings.settingsDir.toPath().endsWith('packages/flutter_tools/gradle')) {
                  settings.pluginManagement.repositories {
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
          }
          GRADLE
      - name: Install pinned SDK packages with the runner's sdkmanager
        run: |
          sdk="${ANDROID_HOME:?Missing Android SDK on the runner}"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          ndk=28.2.13676358
          "$manager" --sdk_root="$sdk" "ndk;$ndk" 'platforms;android-36' 'build-tools;36.0.0'
          test -x "$sdk/ndk/$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          test -x "$sdk/build-tools/36.0.0/aapt2"
          echo "ANDROID_NDK_HOME=$sdk/ndk/$ndk" >> "${GITHUB_ENV:?}"
      - run: flutter pub get
      - run: python3 tool/build.py apk
      - uses: actions/upload-artifact@v6
        with:
          name: fcxray-android-debug
          path: build/app/outputs/flutter-apk/fcxray-debug.apk
