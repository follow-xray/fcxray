name: Release builds
on:
  push:
    tags: ['**']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name == 'workflow_dispatch' || github.event.deleted == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python3 tool/build.py check
      - run: python3 tool/smoke.py

  apk:
    if: github.event_name == 'workflow_dispatch' || github.event.deleted == false
    name: Build ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: native/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      # Flutter's included plugin build resolves its own plugins independently
      # of android/settings.gradle.kts. Keep this in the workflow so it also
      # applies when workflow_dispatch checks out an older release tag.
      - name: Resolve Flutter Gradle plugin dependencies from Maven Central
        run: |
          init_dir="${GRADLE_USER_HOME:-$HOME/.gradle}/init.d"
          mkdir -p "$init_dir"
          cat > "$init_dir/fcxray-flutter-plugin-repositories.gradle" <<'GRADLE'
          gradle.beforeSettings { settings ->
              if (settings.settingsDir.toPath().endsWith('packages/flutter_tools/gradle')) {
                  settings.pluginManagement.repositories {
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
          }
          GRADLE
      - name: Install pinned SDK packages with the runner's sdkmanager
        run: |
          sdk="${ANDROID_HOME:?Missing Android SDK on the runner}"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          ndk=28.2.13676358
          "$manager" --sdk_root="$sdk" "ndk;$ndk" 'platforms;android-36' 'build-tools;36.0.0'
          test -x "$sdk/ndk/$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          test -x "$sdk/build-tools/36.0.0/aapt2"
          echo "ANDROID_NDK_HOME=$sdk/ndk/$ndk" >> "${GITHUB_ENV:?}"
      - run: flutter pub get
      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64$STORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]]; then
            echo "::notice::No release signing secrets configured. Using runner debug signing."
            exit 0
          fi
          : "${KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64}" "${STORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}" "${KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fcxray-signing.jks"
          echo "FCXRAY_KEYSTORE_PATH=$RUNNER_TEMP/fcxray-signing.jks" >> "$GITHUB_ENV"
      - name: Build and verify APK
        id: build
        env:
          ABI: ${{ matrix.abi }}
          TAG: ${{ inputs.tag || github.ref_name }}
          FCXRAY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FCXRAY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FCXRAY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tool/build.py tag-apk --tag="$TAG" --abi="$ABI"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: ${{ steps.build.outputs.apk }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/fcxray-signing.jks"

  desktop:
    if: github.event_name == 'workflow_dispatch' || github.event.deleted == false
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get
      # Older tags rely on Python to locate flutter.bat, which fails on Windows.
      # Run the tag's native build steps and invoke Flutter from PowerShell.
      - name: Build and archive Windows portable bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python tool/build.py core --goos windows --arch amd64
          python tool/build.py wintun --arch amd64
          flutter build windows --release
          $bundle = Resolve-Path 'build/windows/x64/runner/Release'
          foreach ($file in 'fcxray.exe','fcxray-core.exe','flutter_windows.dll','wintun.dll','data/app.so','data/icudtl.dat','WINTUN-LICENSE.txt') {
            if (!(Test-Path (Join-Path $bundle $file) -PathType Leaf)) { throw "Missing $file" }
          }
          [IO.Compression.ZipFile]::CreateFromDirectory($bundle.Path, (Join-Path $PWD 'windows-x64.zip'))
      - name: Build and archive macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python3 tool/build.py macos --arch arm64
          app=build/macos/Build/Products/Release/fcxray.app
          for binary in fcxray fcxray-core; do
            test -x "$app/Contents/MacOS/$binary"
            lipo "$app/Contents/MacOS/$binary" -verify_arch arm64
          done
          codesign --verify --strict --deep "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" macos-arm64.zip
      - uses: actions/upload-artifact@v6
        with:
          name: fcxray-${{ matrix.target }}
          path: ${{ matrix.target }}.zip
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  release:
    name: Publish APKs and desktop ZIPs
    needs: [apk, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: android-release-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: fcxray-*
          path: release-assets
          merge-multiple: true
      - name: Publish all four assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          arm64=(release-assets/fcxray-*-android-arm64-v8a.apk)
          armv7=(release-assets/fcxray-*-android-armeabi-v7a.apk)
          if (( ${#arm64[@]} != 1 || ${#armv7[@]} != 1 )); then
            echo "::error::Expected exactly one APK for each Android ABI"
            exit 1
          fi
          [[ -s "${arm64[0]}" && -s "${armv7[0]}" ]]
          [[ "${arm64[0]%-arm64-v8a.apk}" == "${armv7[0]%-armeabi-v7a.apk}" ]]

          prefix=${arm64[0]%-android-arm64-v8a.apk}
          assets=("${arm64[0]}" "${armv7[0]}")
          for platform in windows-x64 macos-arm64; do
            test -s "release-assets/$platform.zip"
            mv "release-assets/$platform.zip" "$prefix-$platform.zip"
            assets+=("$prefix-$platform.zip")
          done

          if ! metadata=$(gh release view --json isDraft,assets -- "$TAG"); then
            flags=(--draft --verify-tag --generate-notes --title "fcxray $TAG")
            if [[ $TAG =~ ^v?[0-9]+\.[0-9]+\.[0-9]+- ]]; then
              flags+=(--prerelease)
            fi
            gh release create "${flags[@]}" -- "$TAG"
            metadata='{"isDraft":true,"assets":[]}'
          fi

          if [[ $(jq -r '.isDraft' <<< "$metadata") == true ]]; then
            gh release upload --clobber -- "$TAG" "${assets[@]}"
            gh release edit --draft=false -- "$TAG"
          else
            # Reruns preserve assets users may already have downloaded.
            for asset in "${assets[@]}"; do
              if ! jq -e --arg name "${asset##*/}" 'any(.assets[]; .name == $name and .state == "uploaded" and .size > 0)' <<< "$metadata" >/dev/null; then
                gh release upload --clobber -- "$TAG" "$asset"
              fi
            done
          fi
